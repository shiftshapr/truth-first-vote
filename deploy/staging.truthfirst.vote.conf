# staging.truthfirst.vote on box #2: node server.js on 127.0.0.1:3041 (PM2 app "truthfirst-staging").
# Behind Cloudflare (proxied, SSL mode Full (strict)). TLS: Cloudflare Origin CA cert for truthfirst.vote
# (apex + wildcard, to 2041); private key generated on box #2, /etc/ssl/cloudflare-origin/truthfirst.vote.key (root 600).
# Install: sudo cp deploy/staging.truthfirst.vote.conf /etc/nginx/sites-available/ && sudo nginx -t && sudo systemctl reload nginx
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.truthfirst.vote;

    ssl_certificate /etc/ssl/cloudflare-origin/truthfirst.vote.pem;
    ssl_certificate_key /etc/ssl/cloudflare-origin/truthfirst.vote.key;

    client_max_body_size 16k;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://127.0.0.1:3041;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Behind Cloudflare: the visitor's IP (used only for the sign-up rate limit).
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.truthfirst.vote;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
