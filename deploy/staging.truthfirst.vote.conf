# staging.truthfirst.vote on box #2: node server.js on 127.0.0.1:3041 (PM2 app "truthfirst-staging").
# HTTP only until DNS points here; then add TLS (Cloudflare Origin CA or certbot) and redirect 80 -> 443.
server {
    listen 80;
    listen [::]:80;
    server_name staging.truthfirst.vote;

    client_max_body_size 16k;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://127.0.0.1:3041;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
