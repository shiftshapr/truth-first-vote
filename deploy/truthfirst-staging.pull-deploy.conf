# shiftshapr/truth-first-vote -> staging.truthfirst.vote on box #2 (added 2026-11-04; Next.js since the rebuild on the
# Coordination Summit code, same day).
#   pm2 truthfirst-staging (/home/ubuntu/truthfirst-vote-staging, `next start -p 3041`), defined in the repo's
#   ecosystem.staging.config.js (secrets from .env.local, never touched by the deploy).
#   Postgres truthfirst_staging (role tf_staging) on 127.0.0.1.
# /home/ubuntu/truthfirst-vote-staging is a git checkout of this repo's staging branch; pd_tree fast-forwards it.
# The build goes to .next-staging-build while the old build keeps serving, then is swapped into .next-staging
# (nginx serves /_next/static/ from there). Safe to rerun on an older commit, so rollback works.
# Public check through Cloudflare (proxied, Full (strict), box #2 origin cert).
# Needs first: git clone https://github.com/shiftshapr/truth-first-vote.git /home/ubuntu/.pull-deploy-src/truth-first-vote
SITE=truthfirst-staging
RUN_AS=ubuntu
REPO_DIR=/home/ubuntu/.pull-deploy-src/truth-first-vote
BRANCH=staging
MODE=live
REQUIRE_GREEN=1          # no Actions workflows yet; with no runs a commit counts as green
GH_REPO=shiftshapr/truth-first-vote
TIMEOUT=1200
DEPLOY_LIB=1
STAGING_STATUS=0         # TEMPORARY: repo has no main branch yet (owner creates it). Remove this line once main exists.
DEPLOY_ENV="PATH=/usr/local/bin:/usr/bin:/bin"

TF_TREE=/home/ubuntu/truthfirst-vote-staging
PM2_ECOSYSTEM=$TF_TREE/ecosystem.staging.config.js
STAGING_WEB3AUTH_ID_PREFIX=BL4DIH0p1zqK3qT6GfVIL4V7   # staging Web3Auth project (public client ID)

deploy() {
  pd_tree "$TF_TREE"
  pd_npm "$TF_TREE"
  if [[ "$PD_ROLLBACK" == 1 ]] || [[ ! -d "$TF_TREE/.next-staging" ]] || pd_changed "$TF_TREE" .; then
    if [[ "${PD_PREVIEW:-0}" == 1 ]]; then
      echo "would: build into .next-staging-build, swap into .next-staging"
    else
      pd_log "next build (.next-staging-build)"
      (cd "$TF_TREE" && rm -rf .next-staging-build .next-staging/types \
        && TF_ENV=staging NEXT_DIST_DIR=.next-staging-build npm run build)
      [[ -d "$TF_TREE/.next-staging-build" ]] || { echo "build output missing"; return 1; }
      rm -rf "$TF_TREE/.next-staging.old"
      [[ -d "$TF_TREE/.next-staging" ]] && mv "$TF_TREE/.next-staging" "$TF_TREE/.next-staging.old"
      mv "$TF_TREE/.next-staging-build" "$TF_TREE/.next-staging"
      rm -rf "$TF_TREE/.next-staging.old"
    fi
    pd_restart truthfirst-staging
  fi

  pd_health http://127.0.0.1:3041/ "Now is the moment to turn toward"
  pd_health http://127.0.0.1:3041/countries "Play the game"
  pd_health http://127.0.0.1:3041/api/stats '"goal"'
  pd_health http://127.0.0.1:3041/api/auth/web3auth/config "\"clientId\": *\"$STAGING_WEB3AUTH_ID_PREFIX"
  pd_health https://staging.truthfirst.vote/ "Now is the moment to turn toward"
}
