# staging.truthfirst.vote on box #2: Next.js on 127.0.0.1:3041 (PM2 app "truthfirst-staging").
# Behind Cloudflare (proxied, SSL mode Full (strict)). TLS: Cloudflare Origin CA cert for truthfirst.vote
# (apex + wildcard, to 2041); private key generated on box #2, /etc/ssl/cloudflare-origin/truthfirst.vote.key (root 600).
# Install: sudo cp nginx/staging.truthfirst.vote.conf /etc/nginx/sites-available/ && sudo nginx -t && sudo systemctl reload nginx
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.truthfirst.vote;

    ssl_certificate /etc/ssl/cloudflare-origin/truthfirst.vote.pem;
    ssl_certificate_key /etc/ssl/cloudflare-origin/truthfirst.vote.key;

    client_max_body_size 2m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /_next/static/ {
        alias /home/ubuntu/truthfirst-vote-staging/.next-staging/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3041;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.truthfirst.vote;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
